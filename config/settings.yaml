# Configuration par défaut de MacroBlock Trader
# Surchargeable via variables d'environnement ou secrets.env

trading:
  capital_base: 10000.0
  risk_pct_a_plus: 1.0
  risk_pct_b: 0.5
  sl_max_pct_price: 1.0
  sl_min_dollars: 0.15
  rr_minimum: 2.0
  max_trades_simultaneous: 1
