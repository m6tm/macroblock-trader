# Configuration par defaut de MacroBlock Trader
# Surchargeable via variables d'environnement ou secrets.env

trading:
  asset: "XAU/USD"
  sl_min_dollars: 15.0
  sl_max_pct_price: 1.0
  rr_minimum: 2.0

killzones:
  london_fix_am: true
  london_fix_pm: true
  ny_open_comex: true
  london_open: true
  asia: false
  ny_close: false

timeframes:
  entry: "M15"
  refinement: "M5"
  trend_h1: "H1"
  trend_h4: "H4"

sentiment:
  cot_url: "https://www.cftc.gov/dea/futures/deacdlf.txt"
  cot_fallback_file: null
  retail_sentiment_url: null
  fear_greed_enabled: true

vector_brain:
  persist_dir: "./data/chroma_db/"
  collection_name: "gold_memory"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  use_chroma_if_available: true
  use_sentence_transformers_if_available: true
  mode_threshold_passive: 30
  mode_threshold_light: 100
  similar_trades_count: 5
  min_trades_for_insight: 3

notifications:
  telegram_enabled: false
  dashboard_enabled: true
  dashboard_port: 8501
